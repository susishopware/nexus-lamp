# ---------------------------------------------------------------------------
# Makes every Nexus lamp in the field blink on a pull request.
#
# This file belongs in the repositories you want to watch (databus,
# nexus-workflow-builder, ...), not only in the lamp project. It publishes one
# MQTT message; the lamps hold outbound subscriptions to the same topic, so
# nothing needs to reach into anybody's home network.
#
# Repository (or organisation) secrets required:
#   MQTT_HOST   broker hostname, no scheme, no port
#   MQTT_USER   the PUBLISH-ONLY broker credential
#   MQTT_PASS   its password
#
# Set these as ORGANISATION secrets, then every further repository only needs
# this file and no setup of its own. The topic is derived from the repository
# name, so nothing here has to be configured per repo.
# ---------------------------------------------------------------------------
name: PR flash

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# One lamp cannot show two states at once, so newer events win.
concurrency:
  group: pr-flash-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  flash:
    runs-on: ubuntu-latest
    # A desk ornament must never be the reason a pull request looks broken.
    continue-on-error: true
    timeout-minutes: 3
    steps:
      - name: Map the GitHub event to a lamp event
        id: ev
        env:
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          case "$ACTION" in
            closed)
              if [[ $MERGED == true ]]; then
                event=merged        # purple, 3 blinks
              else
                event=closed        # grey, 2 blinks
              fi
              ;;
            *)
              event=opened          # shopware blue, 2 blinks
              ;;
          esac
          echo "event=$event" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION -> event=$event"

      - name: Publish to the broker
        env:
          MQTT_HOST: ${{ secrets.MQTT_HOST }}
          MQTT_USER: ${{ secrets.MQTT_USER }}
          MQTT_PASS: ${{ secrets.MQTT_PASS }}
          EVENT: ${{ steps.ev.outputs.event }}
          # Lamps subscribe to nexus/v1/pr/+ — one publish reaches all of them,
          # and the repo name stays in the topic for later filtering.
          MQTT_TOPIC: nexus/v1/pr/${{ github.event.repository.name }}
        run: |
          if [[ -z ${MQTT_HOST:-} ]]; then
            echo "::notice::MQTT_HOST not set, skipping"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq mosquitto-clients
          # Deliberately NOT --retain: a retained message would be replayed to
          # every lamp on every reconnect, so a router reboot would flash the
          # whole fleet for a pull request from last week.
          mosquitto_pub \
            --host "$MQTT_HOST" --port 8883 \
            --capath /etc/ssl/certs \
            --username "$MQTT_USER" --pw "$MQTT_PASS" \
            --topic "$MQTT_TOPIC" \
            --qos 1 \
            --message "{\"event\":\"$EVENT\"}" \
            || echo "::warning::could not reach the MQTT broker, lamps stay dark"

# To also flash red on a failing CI run, add a second workflow triggered by
# `workflow_run` with `types: [completed]`, and publish
# {"event":"failure"} or {"event":"success"} based on
# github.event.workflow_run.conclusion.
