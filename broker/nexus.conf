# Mosquitto for the Nexus lamps. Goes to /etc/mosquitto/conf.d/nexus.conf on
# the broker container; the distribution's mosquitto.conf includes conf.d.
#
#   lamp --wss:443--> Cloudflare --tunnel--> cloudflared (Home Assistant add-on)
#        --ws:9001--> Mosquitto (192.168.0.12)
#
# TLS ends at Cloudflare. The container is not reachable from the internet; the
# only way in from outside is the tunnel. Inside the LAN both listeners need a
# login, anonymous access is off.

per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# For cloudflared in the Home Assistant add-on. Lamps connect here through the
# tunnel; the add-on's additional_hosts entry points at http://<this ip>:9001.
listener 9001
protocol websockets

# Home LAN only: manual tests with mosquitto_pub/sub and, later, n8n.
listener 1883
protocol mqtt
